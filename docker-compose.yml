services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  compilador:
    build:
      context: .
      dockerfile: docker/compilador/Dockerfile
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/smacly
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/smacly
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mongo
    restart: unless-stopped

  siddhi:
    build:
      context: .
      dockerfile: docker/siddhi/Dockerfile
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.45.3
    entrypoint: ["/bin/sh", "/cep4fun/entrypoint.sh"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en .env}
    volumes:
      - ./n8n:/workflows-src:ro
      - ./docker/n8n/entrypoint.sh:/cep4fun/entrypoint.sh:ro
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:15678:5678"
    restart: unless-stopped

  smacly-web:
    build: ./smacly-web
    environment:
      PORT: "3000"
      COMPILADOR_URL: http://compilador:8080
      N8N_URL: http://n8n:5678
    ports:
      - "3000:3000"
    depends_on:
      - compilador
      - n8n
    restart: unless-stopped

volumes:
  mongo-data:
  n8n-data:
