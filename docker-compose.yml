services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  compilador:
    build:
      context: .
      dockerfile: docker/compilador/Dockerfile
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/smacly
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/smacly
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mongo
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  flink-jobmanager:
    image: flink:2.2.1-java17
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.savepoints.dir: file:///opt/flink/savepoints
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    restart: unless-stopped

  flink-taskmanager:
    image: flink:2.2.1-java17
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 12
        state.savepoints.dir: file:///opt/flink/savepoints
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.45.3
    entrypoint: ["/bin/sh", "/cep4fun/entrypoint.sh"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en .env}
    volumes:
      - ./n8n:/workflows-src:ro
      - ./docker/n8n/entrypoint.sh:/cep4fun/entrypoint.sh:ro
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:15678:5678"
    restart: unless-stopped

  smacly-web:
    build: ./smacly-web
    environment:
      PORT: "3000"
      COMPILADOR_URL: http://compilador:8080
      N8N_URL: http://n8n:5678
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "3000:3000"
    depends_on:
      - compilador
      - n8n
      - kafka
    restart: unless-stopped

volumes:
  mongo-data:
  n8n-data:
  kafka-data:
  flink-checkpoints:
  flink-savepoints:
