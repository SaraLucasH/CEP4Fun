<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>SmaCly - Register</title>
  <link rel="stylesheet" href="/resources/styles.css">
  <link rel="shortcut icon" href="/resources/iconoNavegador.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
  <style>
    .authWrapper {
      max-width: 420px;
      margin: 50px auto;
      padding: 24px;
      border-radius: 10px;
      background-color: rgb(135, 143, 223);
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }

    .authWrapper h1 {
      background: none;
      font-size: 150%;
    }

    .authWrapper input[type="text"],
    .authWrapper input[type="password"],
    .authWrapper input[type="email"] {
      width: 90%;
      padding: 8px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #057fd0;
    }

    .authWrapper .button {
      width: 94%;
      margin-top: 10px;
      padding: 10px;
    }

    .authLink {
      display: block;
      margin-top: 14px;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="authWrapper">
    <img id="logo" src="/resources/logo.png" style="position: static; width: 90px; height: 90px;" />
    <h1>Create your account</h1>
    <form id="registerForm">
      <input type="text" id="user" placeholder="Username" required autocomplete="username">
      <input type="text" id="nombre" placeholder="First name">
      <input type="text" id="apellido" placeholder="Last name">
      <input type="text" id="institucion" placeholder="Institution">
      <input type="email" id="email" placeholder="Email" required autocomplete="email">
      <input type="password" id="password" placeholder="Password" required autocomplete="new-password">
      <input type="password" id="password2" placeholder="Confirm password" required autocomplete="new-password">
      <input type="submit" class="button" value="Register">
    </form>
    <a class="authLink" href="/login.html">Already have an account? Log in</a>
  </div>

  <script>
    toastr.options = { closeButton: true, timeOut: 4000, positionClass: 'toast-top-right' };

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var password = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;
      if (password !== password2) {
        toastr.error('The passwords entered do not match');
        return;
      }
      var payload = {
        user: document.getElementById('user').value.trim(),
        nombre: document.getElementById('nombre').value.trim(),
        apellidos: document.getElementById('apellido').value.trim(),
        institucion: document.getElementById('institucion').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: password
      };
      try {
        var response = await fetch('/api/registrarUsuario', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        var data = await response.json();
        if (data.exito) {
          toastr.success(data.mensaje || 'User successfully registered');
          setTimeout(function () { window.location.href = '/login.html'; }, 1200);
        }
        else {
          toastr.error(data.mensaje || 'The user could not be registered');
        }
      }
      catch (error) {
        toastr.error('Error connecting to the server');
      }
    });
  </script>
</body>

</html>
