<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="es">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmaCly - Login</title>
  <link rel="stylesheet" href="/resources/styles-smacly.css">
  <link rel="shortcut icon" href="/resources/iconoNavegador.ico" />
</head>
<body class="pantalla-login">

  <header class="app-header">
    <div class="app-header__inner">
      <img id="logo" src="/resources/logoSmaCly2.png" alt="SmaCly logo"/>

      <div class="app-header__text">
        <h1 id="title">SmaCly : Design your smart contract using Blockly</h1>
      </div>

      <div class="app-header__actions"></div>
    </div>
  </header>

  <main class="pantalla-centro">
    <section class="tarjeta">
      <h2 class="tarjeta-titulo">Sign In</h2>
      <p class="tarjeta-texto">Log in to access your workspace</p>

      <form id="loginForm" class="formu">
        <div class="campo">
          <label for="username">Username or email address</label>
          <input type="text" id="username" name="username" placeholder="Your account name or your user@email.com" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Insert here your password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="button boton-grande">Sign in</button>
      </form>

      <p id="mensaje" class="aviso"></p>

      <p class="texto-centro">
         Don't have an account on SmaCly?
        <a href="/register.html" class="link">Sign up here</a>
      </p>
    </section>
  </main>

  <script>
    const mensaje = document.getElementById('mensaje');

    function mostrarMensaje(texto, color) {
      mensaje.textContent = texto;
      mensaje.style.color = color;
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'true') {
      mostrarMensaje('Incorrect username or password', 'red');
    }
    if (params.get('logout') === 'true') {
      mostrarMensaje('Session closed successfully', 'green');
    }

    // CEP4Fun: the server authenticates through JSON (/login) instead of a Spring form post
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        const data = await response.json();
        if (data.exito) {
          window.location.href = '/home.html';
        } else {
          mostrarMensaje(data.mensaje || 'Incorrect username or password', 'red');
        }
      } catch (error) {
        mostrarMensaje('Error connecting to the server', 'red');
      }
    });
  </script>
</body>
</html>
